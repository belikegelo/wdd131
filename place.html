<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Angelo Antimo , a web development projects and a personal info">
    <meta name="author" content="Angelo Antimo">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/place.js" defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
</head>
<body>
    <header>
        <h1>Philippines</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="images/large_place.webp">
                <source media="(min-width: 700px)" srcset="images/medium_place.webp">
                <img src="images/small_place.webp" alt="Beautiful view of the place">
            </picture>
        </div>

        <section class="data">
            <h2>Data</h2>

            <div class="data-list">
                <p><span>Area:</span> <span>100 km²</span></p>
                <p><span>Population:</span> <span>50,000</span></p>
                <p><span>Elevation:</span> <span>500 m</span></p>
                <p><span>Languages:</span> <span>English</span></p>
                <p><span>Currency:</span> <span>PHP</span></p>
                <p><span>Time Zone:</span> <span>UTC+8</span></p>
            </div>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img
                class="weather-icon"
                src="images/weather-icon.svg"
                alt="Weather icon"
            >

            <div class="weather-list">
                <p><span>Temperature:</span> <span id="temperature">8 °C</span></p>
                <p><span>Wind Speed:</span> <span id="wind-speed">12 km/h</span></p>
                <p><span>Wind Chill:</span> <span id="wind-chill"></span></p>
            </div>
        </section>
    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span> 🌱 Angelo Antimo 🌱 Cavite, Philippines
        </p>
        <p class="last-modified"> Last Modified: <span id="lastModified"></span> </p>  

    </footer>
    
</body>
</html>
